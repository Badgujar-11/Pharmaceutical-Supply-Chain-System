{% extends 'base.html' %}
{% load static %}
{% load django_bootstrap5 %}

{% block content %}
<section class="bg-gradient text-white py-5" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-lg animate__animated animate__fadeInUp" style="border-radius: 20px; overflow: hidden;">
                    <div class="card-header bg-primary text-white text-center py-4 border-0">
                        <h3 class="mb-0 fw-bold">{{ action }} Product</h3>
                    </div>
                    <div class="card-body p-5" style="background: #f8f9fa;">
                        <form method="post">
                            {% csrf_token %}
                            {% bootstrap_form form %}
                            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold mt-3">
                                {{ action }} Product
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{% url 'product_list' %}" class="text-primary fw-bold">← Back to List</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
.bg-gradient { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
.form-control:focus { border-color: #ffc107; box-shadow: 0 0 0 0.25rem rgba(255,193,7,0.25); }
.btn-warning { background: linear-gradient(45deg, #ffc107, #ff8c00); border: none; }
.btn-warning:hover { background: linear-gradient(45deg, #ff8c00, #f57c00); transform: scale(1.05); }
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
{% endblock %}
