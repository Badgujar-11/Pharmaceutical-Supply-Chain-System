{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="py-5 bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-exclamation-triangle fs-1 text-warning mb-4"></i>
                        <h3 class="mb-3">Cancel Order?</h3>
                        <p class="text-muted mb-4">Are you sure you want to cancel Order #{{ order.pk }} ({{ order.product.name }})? This action cannot be undone.</p>
                        <form method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger me-3">Yes, Cancel</button>
                        </form>
                        <a href="{% url 'order_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
{% endblock %}
